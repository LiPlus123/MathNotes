complex_analysis:
  title: 复分析
  sections:
    - complex_plane:
        title: 复平面
        subsections:
            - topology_of_complex_plane:
                title: 复平面的拓扑
                content: 复平面中的开集、闭集、边界、连通集、紧集、聚点、孤立点、单连通与多连通区域、凸集
            - riemann_sphere:
                title: Riemann 球面
                content: 广义复平面、球极投影、Riemann 球面的拓扑与共形结构、无穷远处的邻域
    - complex_function:
        title: 复变函数
        subsections:
            - definition_of_complex_function:
                title: 复变函数的定义
                content: 复变函数作为 C→C 的映射、实部与虚部分解、多值函数与单值分支
            - limit_and_continuity:
                title: 极限与连续性
                content: 复变函数的极限、连续性、复变函数的一致连续性、紧集上连续函数的性质
    - differential_calculus:
        title: 复变函数的微分学
        subsections:
            - differentiation_and_derivatives:
                title: 微分与导数
                content: 复变函数微分与导数的定义、复可微与实可微的区别
            - cauchy_riemann_equations:
                title: Cauchy-Riemann 方程
                content: Cauchy-Riemann 方程、极坐标形式的 CR 方程、Wirtinger 微分算子
            - analytic_functions:
                title: 解析函数
                content: 解析函数的定义（实解析函数与复解析函数的区别，复解析函数与全纯函数的关系）、解析函数的无穷次可微性、复解析函数实部与虚部的调和性
            - common_analytic_functions:
                title: 常见解析函数及其导数
                content: 指数函数、对数函数、幂函数、三角函数、双曲函数、多值函数的单值分支
            - conformal_mapping_intro:
                title: 共形映射初步
                content: 共形映射的定义、共形映射与解析函数的关系、共形映射的几何意义
    - integral_calculus:
        title: 复变函数的积分学
        subsections:
            - line_integrals:
                title: 复线积分
                content: 沿曲线的复积分、参数化计算、长度估计不等式（ML 不等式）
            - cauchy_integral_theorem:
                title: Cauchy 积分定理
                content: 单连通区域上解析函数的 Cauchy 积分定理、复连通区域上的 Cauchy 积分定理、原函数的存在性
            - cauchy_integral_formula_and_applications:
                title: Cauchy 积分公式及其应用
                content: Cauchy 积分公式、解析函数的无穷可微性、高阶导数公式、Cauchy 不等式、最大模定理、Morera 定理、Liouville 定理、代数基本定理的复分析证明
    - series_expansion:
        title: 级数展开
        subsections:
            - complex_power_series:
                title: 复幂级数
                content: 复幂级数的收敛半径、Cauchy-Hadamard 公式、收敛圆盘内的一致收敛、幂级数的逐项求导与积分
            - taylor_series:
                title: Taylor 级数
                content: 全纯函数的 Taylor 展开、收敛半径与最近奇点、Taylor 系数的积分表达
            - laurent_series:
                title: Laurent 级数
                content: 圆环上的 Laurent 展开、Laurent 系数的积分表达、Laurent 级数与幂级数的关系
            - uniform_convergence_of_analytic_functions:
                title: 解析函数序列的一致收敛
                content: Weierstrass 一致收敛定理（内闭一致收敛保持解析性）、逐项求导定理
    - zeros_singularities_residues:
        title: 零点、奇点与留数
        subsections:
            - zeros_and_identity_theorem:
                title: 零点与恒等定理
                content: 解析函数的零点、零点的阶、孤立零点、恒等定理（唯一性定理）
            - singularities:
                title: 奇点分类
                content: 孤立奇点、可去奇点、极点、本性奇点、Riemann 可去奇点定理、Casorati-Weierstrass 定理、Picard 定理简介
            - meromorphic_functions:
                title: 亚纯函数
                content: 亚纯函数的定义与基本性质、极点与零点的关系、扩充复平面上的亚纯函数即为有理函数
            - residue_theorem:
                title: 留数定理
                content: 留数的定义、留数的计算方法（单极点、高阶极点、本性奇点）、留数定理
            - applications_of_residues:
                title: 留数的应用
                content: 计算实积分（有理函数积分、三角积分、含 sin/cos 的无穷积分、Jordan 引理）、计算级数求和
            - argument_principle_and_rouche_theorem:
                title: 辐角原理与 Rouché 定理
                content: 对数导数、辐角原理、Rouché 定理、开映射定理、局部反函数定理、幅角原理在零点计数中的应用
    - analytic_continuation:
        title: 解析延拓
        subsections:
            - direct_analytic_continuation:
                title: 直接解析延拓
                content: 解析延拓的定义与唯一性、幂级数的解析延拓
            - continuation_along_curves:
                title: 沿曲线的解析延拓
                content: 沿曲线的解析延拓、单值性定理
            - riemann_surfaces_intro:
                title: Riemann 面初步
                content: 多值函数与 Riemann 面、对数函数与幂函数的 Riemann 面
            - reflection_principle:
                title: Schwarz 反射原理
                content: 关于实轴的 Schwarz 反射原理、更一般的反射原理
    - entire_and_meromorphic_functions:
        title: 整函数与亚纯函数
        subsections:
            - infinite_products:
                title: 无穷乘积
                content: 无穷乘积的收敛、绝对收敛与一致收敛、函数项无穷乘积
            - weierstrass_factorization:
                title: Weierstrass 因子分解定理
                content: Weierstrass 初等因子、给定零点的整函数构造、Weierstrass 因子分解定理
            - mittag_leffler_theorem:
                title: Mittag-Leffler 定理
                content: 给定极点及主要部分的亚纯函数构造、Mittag-Leffler 定理、部分分式展开
            - growth_of_entire_functions:
                title: 整函数的增长阶
                content: 整函数的增长阶与型、Jensen 公式、零点分布与增长的关系
            - hadamard_factorization:
                title: Hadamard 因子分解定理
                content: 有限阶整函数的 Hadamard 因子分解定理、亏格
    - special_functions:
        title: 特殊函数
        subsections:
            - gamma_function:
                title: Gamma 函数
                content: Gamma 函数的多种定义（Euler 积分、Weierstrass 乘积、Gauss 极限）、函数方程、反射公式、Legendre 倍元公式、Stirling 公式与渐近展开、Gamma 函数的零极点分布
            - beta_function:
                title: Beta 函数
                content: Beta 函数的定义、与 Gamma 函数的关系、Beta 函数的性质
            - zeta_function_intro:
                title: Riemann zeta 函数初步
                content: zeta 函数的级数与积分表示、Euler 乘积、初步的解析延拓与函数方程（详见解析数论章节）
    - conformal_mapping:
        title: 共形映射与几何函数论
        subsections:
            - mobius_transformations:
                title: 分式线性变换
                content: 分式线性变换（Möbius 变换）、交比、圆周与直线的映射、单位圆盘的自同构
            - schwarz_lemma:
                title: Schwarz 引理与 Schwarz-Pick 引理
                content: Schwarz 引理、Schwarz-Pick 引理、Poincaré 度量、单位圆盘的双曲几何
            - normal_families:
                title: 正规族
                content: 正规族的定义、Montel 定理、Vitali 收敛定理
            - riemann_mapping_theorem:
                title: Riemann 映射定理
                content: Riemann 映射定理的陈述与证明思路、边界对应（Carathéodory 扩张定理）
            - schwarz_christoffel_transformation:
                title: Schwarz-Christoffel 变换
                content: 多边形区域到上半平面的共形映射
    - harmonic_functions:
        title: 调和函数
        subsections:
            - harmonic_functions_basics:
                title: 调和函数与共轭调和函数
                content: 调和函数的定义、共轭调和函数的存在性、调和函数与全纯函数的关系
            - mean_value_and_maximum_principle:
                title: 均值性质与极值原理
                content: 调和函数的均值性质、极值原理、Harnack 不等式、Liouville 型定理
            - poisson_integral:
                title: Poisson 积分
                content: 单位圆盘上的 Poisson 核、Poisson 积分公式、Poisson 积分的边值性质
            - dirichlet_problem:
                title: Dirichlet 问题
                content: 圆盘上的 Dirichlet 问题、Perron 方法、次调和函数
    - elliptic_functions_intro:
        title: 椭圆函数简介
        subsections:
            - doubly_periodic_functions:
                title: 双周期函数
                content: 周期与格、基本平行四边形、Liouville 定理组
            - weierstrass_p_function:
                title: Weierstrass p 函数
                content: p 函数的定义、微分方程、加法定理
            - modular_forms_intro:
                title: 模形式初步
                content: 上半平面与模群、模形式的定义、Eisenstein 级数（衔接解析数论）